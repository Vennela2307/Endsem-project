<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">

    <title>SpeedyFoodie - Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🍔 SpeedyFoodie
        </div>

        <div class="settings">

            <select id="themeSelector">

                <option value="light">
                    ☀️ Light
                </option>

                <option value="dark">
                    🌙 Dark
                </option>

                <option value="purple">
                    💜 Purple
                </option>

            </select>

            <select id="languageSelector">

                <option value="en">
                    English
                </option>

                <option value="te">
                    తెలుగు
                </option>

                <option value="hi">
                    हिन्दी
                </option>

            </select>

        </div>

    </nav>

    <!-- Register -->

    <section class="login-section">

        <div class="login-card register-card">

            <div class="login-icon">
                🍔
            </div>

            <h1 id="registerTitle">
                Create Account
            </h1>

            <p class="subtitle" id="registerSubtitle">
                Join SpeedyFoodie today!
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name" id="nameLabel">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerEmail" id="emailLabel">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerPassword" id="passwordLabel">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword" id="confirmLabel">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="createButton"
                >
                    Create Account
                </button>

            </form>

            <div class="divider">

                <span>
                    OR
                </span>

            </div>

            <p class="register-text">

                <span id="alreadyText">
                    Already have an account?
                </span>

                <a href="login.html" id="loginLink">
                    Login
                </a>

            </p>

        </div>

    </section>

    <footer>

        <p>
            © 2026 SpeedyFoodie. All Rights Reserved.
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
