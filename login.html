<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedyFoodie - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">🍔 SpeedyFoodie</div>

        <div class="settings">
            <select id="themeSelector">
                <option value="light">☀️ Light</option>
                <option value="dark">🌙 Dark</option>
                <option value="purple">💜 Purple</option>
            </select>

            <select id="languageSelector">
                <option value="en">English</option>
                <option value="te">తెలుగు</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">

        <div class="login-card">

            <div class="login-icon">🍔</div>

            <h1 id="loginTitle">Welcome!</h1>

            <p class="subtitle" id="loginSubtitle">
                Login to continue your food journey
            </p>

            <form id="loginForm">

                <label for="email" id="loginEmailLabel">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password" id="loginPasswordLabel">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        <span id="rememberText">
                            Remember me
                        </span>
                    </label>

                    <a href="#" id="forgotText">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="register-text">

                <span id="newAccountText">
                    Don't have an account?
                </span>

                <a
                    href="register.html"
                    id="createAccountLink"
                >
                    Create Account
                </a>

            </p>

        </div>

    </section>

    <footer>
        <p>
            © 2026 SpeedyFoodie. All Rights Reserved.
        </p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
